<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register - ShopKart</title>

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<main class="auth">

<div class="auth-box">

<h1>
🛒 ShopKart
</h1>

<h2>
Create Account
</h2>


<form onsubmit="registerUser(event)">

<input
required
placeholder="Full Name">


<input
type="email"
required
placeholder="Email Address">


<input
type="password"
required
minlength="6"
placeholder="Password">


<input
type="password"
required
minlength="6"
placeholder="Confirm Password">


<button class="btn">
Register
</button>

</form>


<p>
Already registered?
<a href="login.html">
Login
</a>
</p>

</div>

</main>


<script src="js/main.js"></script>

</body>
</html>
