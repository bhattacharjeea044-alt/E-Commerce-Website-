<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - ShopKart</title>

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<main class="auth">

<div class="auth-box">

<h1>
🛒 ShopKart
</h1>

<h2>
Welcome Back
</h2>


<form onsubmit="loginUser(event)">

<input
id="email"
type="email"
required
placeholder="Email Address">


<input
id="password"
type="password"
required
placeholder="Password">


<button class="btn">
Login
</button>

</form>


<p>
New customer?
<a href="register.html">
Create an account
</a>
</p>


<a href="index.html">
← Back to Home
</a>

</div>

</main>


<script src="js/main.js"></script>

</body>
</html>
