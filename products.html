<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Products - ShopKart</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<header>

<nav class="navbar">

    <a href="index.html" class="logo">
        🛒 ShopKart
    </a>

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Search products..."
            onkeyup="filterProducts()">

        <button onclick="filterProducts()">
            🔍
        </button>

    </div>

    <div class="navlinks">

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="wishlist.html">
            ❤️ <span id="wishCount">0</span>
        </a>

        <a href="cart.html">
            🛒 <span id="cartCount">0</span>
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>

</header>


<main class="section">

    <div class="section-head">

        <h1>
            All Products
        </h1>

        <select
            id="sortSelect"
            onchange="filterProducts()">

            <option value="default">
                Sort: Featured
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

            <option value="rating">
                Rating
            </option>

        </select>

    </div>


    <div class="filters">

        <button
            class="active"
            onclick="setCategory('All',this)">
            All
        </button>

        <button
            onclick="setCategory('Fashion',this)">
            Fashion
        </button>

        <button
            onclick="setCategory('Electronics',this)">
            Electronics
        </button>

        <button
            onclick="setCategory('Home',this)">
            Home
        </button>

        <button
            onclick="setCategory('Beauty',this)">
            Beauty
        </button>

        <button
            onclick="setCategory('Sports',this)">
            Sports
        </button>

    </div>


    <div
        id="productGrid"
        class="product-grid">
    </div>

</main>


<footer>
    © 2026 ShopKart · All Rights Reserved
</footer>


<script src="js/products.js"></script>
<script src="js/main.js"></script>

<script>
    renderProducts();
</script>

</body>
</html>
